apiVersion: v2
name: besu-stack
description: Production-ready Hyperledger Besu blockchain network deployment for Kubernetes
type: application
version: 0.3.7
appVersion: "26.6.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/settlemint/besu-helm
icon: https://raw.githubusercontent.com/hyperledger/besu-docs/main/static/img/besu-logo.svg
sources:
  - https://github.com/settlemint/besu-helm
  - https://github.com/hyperledger/besu
maintainers:
  - name: SettleMint
    email: support@settlemint.com
    url: https://settlemint.com
keywords:
  - blockchain
  - besu
  - hyperledger
  - ethereum
  - qbft
  - ibft
  - validator
  - rpc
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: fixed
      description: Generated static-nodes.json enode URLs now use namespace-relative hostnames instead of embedding the release namespace, so a workload restored into a differently-named namespace peers with its own validators rather than the original deployment
    - kind: fixed
      description: The wait-for-validators init container now probes a namespace-relative hostname, so RPC nodes restored into a differently-named namespace no longer block forever on a validator in the original deployment
    - kind: removed
      description: Dead besu-stack.bootnodes helper and the discovery.bootnodes value it read; the helper was referenced by no template, emitted invalid enode-less host:port entries, and embedded the release namespace
