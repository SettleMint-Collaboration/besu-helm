apiVersion: v2
name: besu-stack
description: Production-ready Hyperledger Besu blockchain network deployment for Kubernetes
type: application
version: 0.3.8
appVersion: "26.6.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/settlemint/besu-helm
icon: https://raw.githubusercontent.com/hyperledger/besu-docs/main/static/img/besu-logo.svg
sources:
  - https://github.com/settlemint/besu-helm
  - https://github.com/hyperledger/besu
maintainers:
  - name: SettleMint
    email: support@settlemint.com
    url: https://settlemint.com
keywords:
  - blockchain
  - besu
  - hyperledger
  - ethereum
  - qbft
  - ibft
  - validator
  - rpc
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/operator: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/changes: |
    - kind: security
      description: "serviceAccount.automountServiceAccountToken now defaults to false and is enforced on the pod spec as well as the ServiceAccount; Besu has no Kubernetes client, so the API credential was mounted into every validator and RPC pod unused"
    - kind: security
      description: "rbac.create now defaults to false; the Role granted the service account get/list/watch on pods, configmaps and secrets, which no workload in the chart reads - genesis, static-nodes and node keys arrive as kubelet-mounted volumes"
    - kind: added
      description: "besu-stack.automountServiceAccountToken helper keeps the projected token mounted when the CyberArk Conjur authenticator runs in authn-jwt mode, which reads it to authenticate to Conjur; authn-k8s is unaffected"
