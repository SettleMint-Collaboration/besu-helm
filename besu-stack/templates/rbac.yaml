{{- if and .Values.serviceAccount.create .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "besu-stack.fullname" . }}
  labels:
    {{- include "besu-stack.labels" . | nindent 4 }}
rules:
  # No workload in this chart uses these permissions. Besu has no Kubernetes
  # client, and genesis, static-nodes and node keys reach the pods as
  # configMap/secret volumes mounted by the kubelet, which needs no RBAC.
  # They are kept behind rbac.create (default false) only as an opt-in for
  # extra containers you run alongside Besu.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "besu-stack.fullname" . }}
  labels:
    {{- include "besu-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "besu-stack.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "besu-stack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
